name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: Linux,                sanitizers: false, tsan: false }
          - { os: macos-latest,   name: macOS,                sanitizers: false, tsan: false }
          - { os: ubuntu-latest,  name: "Linux (sanitizers)", sanitizers: true,  tsan: false }
          - { os: ubuntu-latest,  name: "Linux (TSan)",       sanitizers: false, tsan: true  }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Cache CMake deps
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: cmake-deps-${{ matrix.os }}-
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=${{ matrix.sanitizers && 'ON' || 'OFF' }} \
            -DENABLE_TSAN=${{ matrix.tsan && 'ON' || 'OFF' }} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        env:
          # ASan: leaks fail the job (exitcode=23). Suppressions in test/sanitizer_suppressions/lsan.supp.
          # The suppression paths are absolute: the step runs the binary from build/,
          # and a relative path made LSan abort with "failed to read suppressions
          # file" (exit 23) as soon as it had any leak to classify.
          # TSan: data races fail the job (halt_on_error=1). Suppressions in test/sanitizer_suppressions/tsan.supp.
          ASAN_OPTIONS: ${{ matrix.sanitizers && 'detect_leaks=1' || 'detect_leaks=0' }}
          LSAN_OPTIONS: ${{ matrix.sanitizers && format('exitcode=23:suppressions={0}/test/sanitizer_suppressions/lsan.supp:print_suppressions=0', github.workspace) || '' }}
          TSAN_OPTIONS: ${{ matrix.tsan && format('halt_on_error=1:second_deadlock_stack=1:suppressions={0}/test/sanitizer_suppressions/tsan.supp:print_suppressions=0', github.workspace) || '' }}
          UBSAN_OPTIONS: ${{ matrix.sanitizers && 'halt_on_error=1:print_stacktrace=1' || '' }}
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          cd build && ./test_superscalar --unit
      - name: In-process factory-creation + dist-TX co-signing ceremony (#54 G1b)
        # Runs the full LSP + N-client creation ceremony in-process (forked
        # clients).  With a real CLTV it co-signs the distribution TX and asserts
        # dist_tx_ready==2 -- validating the G1b wire threading end-to-end (the
        # unit suite only covers the dist crypto, not the multi-party ceremony).
        # Plain LINUX config only: the test fork()s many client processes, which
        # deadlocks under ASan/TSan (sanitizer allocator across fork) and is flaky
        # on the macOS runner (fork + socket semantics).  The dist crypto still
        # gets cross-platform + ASan/TSan coverage via the unit suite
        # (test_factory_distribution_tx_distributed).
        if: ${{ runner.os == 'Linux' && !matrix.sanitizers && !matrix.tsan }}
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ./build/test_inproc_scale 4
      - name: CLN plugin unit tests
        # Plugin logic with the CLN RPC and bridge socket mocked; no node needed.
        if: ${{ runner.os == 'Linux' && !matrix.sanitizers && !matrix.tsan }}
        run: python3 -m unittest -v tools/test_cln_plugin.py
      - name: CLN-bridge secure-by-default (#5 finding 1)
        # The bridge must REFUSE to start without --lsp-pubkey (unauthenticated NN
        # is MITM-exposed) unless --insecure-no-auth is explicitly passed.
        if: ${{ runner.os == 'Linux' && !matrix.sanitizers && !matrix.tsan }}
        run: |
          rc=0; ./build/superscalar_bridge >/tmp/br.out 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: bridge started WITHOUT --lsp-pubkey"; cat /tmp/br.out; exit 1
          fi
          # A configuration error is reported as 78 so supervisors do not loop
          [ "$rc" -eq 78 ] || { echo "FAIL: exit status $rc, expected 78"; exit 1; }
          grep -q "refusing to start without --lsp-pubkey" /tmp/br.out || {
            echo "FAIL: missing secure-by-default refusal"; cat /tmp/br.out; exit 1; }
          echo "OK: bridge refuses unauthenticated NN startup by default"
      - name: Daemon start-up gates
        # Each daemon must refuse an unsafe mainnet start (either spelling of
        # the chain name), an unknown chain and an unpinned LSP before it does
        # anything.  No node is needed: every case exits at the start-up check.
        if: ${{ runner.os == 'Linux' && !matrix.sanitizers && !matrix.tsan }}
        run: tools/test_startup_gates.sh build

  # A pull request may raise PERSIST_SCHEMA_VERSION by one (with its
  # migration) or leave it alone; anything else fails.
  schema-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Schema version
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PERSIST_SCHEMA_VERSION changed by at most +1
        run: tools/check_schema_version.sh "origin/${{ github.base_ref }}"

  arm64-build-test:
    runs-on: ubuntu-latest
    name: Linux ARM64
    if: github.event_name == 'push'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build and test in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            --ulimit stack=134217728:134217728 \
            -v "${{ github.workspace }}:/src" -w /src \
            ubuntu:24.04 bash -c '
              apt-get update && apt-get install -y cmake gcc g++ git \
                libsqlite3-dev libssl-dev autoconf libtool
              cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5
              cmake --build build --parallel
              ulimit -s 131072 2>/dev/null || ulimit -s unlimited 2>/dev/null || true
              cd build && ./test_superscalar --unit
            '

  static-analysis:
    # Pinned: cppcheck comes from the runner image's apt archive, so
    # ubuntu-latest silently changes the checker (24.04 ships 2.13, 26.04
    # ships 2.19, which adds checks) and turns the job red without a code
    # change.  The tree is clean under both; bump the pin deliberately.
    runs-on: ubuntu-24.04
    name: Static Analysis
    # cppcheck on tools/superscalar_lsp.c can take 12-18 min on the
    # GitHub Actions runner under load; the rest of the corpus finishes
    # in ~5 min.  35 min was still occasionally hit — cppcheck was
    # canceled mid-run (~35m) on a slow/loaded runner before emitting
    # results; bumped to 50 to absorb worst-case variance.
    # --max-configs=1 caps preprocessor branch enumeration at 1
    # (default ~12) which dramatically reduces work on this file
    # without losing meaningful warnings (we don't ship multi-config
    # builds).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev cppcheck
      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build (needed for FetchContent headers)
        run: cmake --build build --parallel
      - name: Cache cppcheck results
        uses: actions/cache@v6
        with:
          path: .cppcheck-cache
          key: cppcheck-${{ runner.os }}-${{ hashFiles('src/**', 'include/**', 'tools/**', 'tests/**', 'fuzz/**', 'CMakeLists.txt') }}
          restore-keys: |
            cppcheck-${{ runner.os }}-
      - name: Run cppcheck
        run: |
          cppcheck --version
          mkdir -p .cppcheck-cache
          cppcheck -j "$(nproc)" --cppcheck-build-dir=.cppcheck-cache             --enable=warning,performance,portability \
            --suppress=missingInclude \
            --suppress=unusedFunction \
            --suppress=duplicateAssignExpression \
            --inline-suppr \
            --max-configs=1 \
            --project=build/compile_commands.json \
            --error-exitcode=1 \
            -i build/_deps \
            2>&1

  regtest-tests:
    runs-on: ubuntu-latest
    name: Regtest Integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev
      - name: Cache Bitcoin Core binary
        id: btc-cache
        uses: actions/cache@v6
        with:
          path: bitcoin-30.3
          key: bitcoin-core-30.3-x86_64
      - name: Download Bitcoin Core 30.3
        if: steps.btc-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://bitcoincore.org/bin/bitcoin-core-30.3/bitcoin-30.3-x86_64-linux-gnu.tar.gz
          echo "4753cd70416c629a2090503e8545a3c05e94a0f5037f8fb97b4c35c6e1afee0e  bitcoin-30.3-x86_64-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf bitcoin-30.3-x86_64-linux-gnu.tar.gz
      - name: Install Bitcoin Core
        run: sudo install -m 0755 bitcoin-30.3/bin/bitcoind bitcoin-30.3/bin/bitcoin-cli /usr/local/bin/
      - name: Configure regtest
        run: |
          mkdir -p ~/.bitcoin
          cat > ~/.bitcoin/bitcoin.conf <<CONF
          regtest=1
          server=1
          rpcuser=rpcuser
          rpcpassword=rpcpass
          fallbackfee=0.00001
          [regtest]
          rpcport=18443
          CONF
      - name: Start bitcoind
        run: |
          bitcoind -regtest -daemon
          sleep 3
          bitcoin-cli -regtest createwallet "test"
          bitcoin-cli -regtest -generate 101 > /dev/null
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --parallel
      - name: Regtest tests
        run: |
          ulimit -s unlimited
          cd build && ./test_superscalar --regtest
      - name: Stop bitcoind
        if: always()
        run: bitcoin-cli -regtest stop 2>/dev/null || true

  regtest-multiprocess-sanitizers:
    runs-on: ubuntu-latest
    name: Regtest Multi-Process (sanitizers)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev sqlite3 python3
      - name: Cache Bitcoin Core binary
        id: btc-cache
        uses: actions/cache@v6
        with:
          path: bitcoin-30.3
          key: bitcoin-core-30.3-x86_64
      - name: Download Bitcoin Core 30.3
        if: steps.btc-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://bitcoincore.org/bin/bitcoin-core-30.3/bitcoin-30.3-x86_64-linux-gnu.tar.gz
          echo "4753cd70416c629a2090503e8545a3c05e94a0f5037f8fb97b4c35c6e1afee0e  bitcoin-30.3-x86_64-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf bitcoin-30.3-x86_64-linux-gnu.tar.gz
      - name: Install Bitcoin Core
        run: sudo install -m 0755 bitcoin-30.3/bin/bitcoind bitcoin-30.3/bin/bitcoin-cli /usr/local/bin/
      - name: Configure regtest
        # The bash harnesses (set -euo pipefail) grep `^datadir=` from this
        # conf with no `|| true` fallback — under pipefail, an empty match
        # kills the script before any reset logic runs.  Include datadir
        # explicitly so the harness's reset path (rm -rf $datadir/regtest)
        # has something to act on.
        run: |
          mkdir -p ~/.bitcoin
          cat > ~/.bitcoin/bitcoin.conf <<CONF
          regtest=1
          server=1
          txindex=1
          datadir=/home/runner/.bitcoin
          rpcuser=rpcuser
          rpcpassword=rpcpass
          fallbackfee=0.00001
          [regtest]
          rpcport=18443
          CONF
      # Build LSP/client/test binaries with ASan+LSan so the bash
      # multi-process harnesses (which spawn these binaries as separate
      # OS processes) catch heap leaks and aliasing in the wire-ceremony
      # driver code paths (lsp_subfactory_chain_advance, lsp_advance_leaf,
      # lsp_realloc_leaf — all introduced by PRs #136-#138).  These paths
      # are NOT exercised by the C-binary regtest suite (`./test_superscalar
      # --regtest` in regtest-tests above) — they only fire under the
      # multi-process bash harnesses below.  Skip TSan: it would flag
      # legitimate cross-process socket I/O as races and break the test.
      - name: Build (Debug + ASan + LSan)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DENABLE_TSAN=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --parallel
      # The bash harnesses default to /var/lib/bitcoind-regtest/bitcoin.conf
      # then fall back to $HOME/bitcoin-regtest/bitcoin.conf — neither is
      # the GitHub Actions setup (~/.bitcoin/bitcoin.conf).  Override via
      # REGTEST_CONF env so the BCLI helper inside the harness uses the
      # right config.
      - name: Multi-process k² sub-factory advance (under ASan+LSan)
        env:
          # verify_asan_link_order=0: harness wraps binaries with `stdbuf -oL`
          # which preloads libstdbuf.so via LD_PRELOAD before the ASan
          # runtime — without the override ASan aborts at libinit.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:verify_asan_link_order=0
          LSAN_OPTIONS: exitcode=23:suppressions=${{ github.workspace }}/test/sanitizer_suppressions/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          bash tools/test_multiprocess_subfactory_advance.sh build
      # PR-C: end-to-end k² sub-factory breach detection.  Builds the
      # factory, advances chain, LSP cheats by broadcasting stale
      # chain[N-1], watchtower must detect + broadcast response_tx +
      # poison_tx.  The 5-blocks-then-sleep pattern between cheat-
      # broadcast and watchtower_check is intentional (see master plan).
      - name: Multi-process k² sub-factory BREACH (under ASan+LSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:verify_asan_link_order=0
          LSAN_OPTIONS: exitcode=23:suppressions=${{ github.workspace }}/test/sanitizer_suppressions/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          bash tools/test_regtest_k2_subfactory_breach.sh build
      - name: Multi-process MuSig N=8 PS (under ASan+LSan)
        env:
          # verify_asan_link_order=0: harness wraps binaries with `stdbuf -oL`
          # which preloads libstdbuf.so via LD_PRELOAD before the ASan
          # runtime — without the override ASan aborts at libinit.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:verify_asan_link_order=0
          LSAN_OPTIONS: exitcode=23:suppressions=${{ github.workspace }}/test/sanitizer_suppressions/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          bash tools/test_multiprocess_musig_n8.sh build
      # Regression guard: --test-distrib must broadcast the REAL co-signed
      # dist_signed_tx (dist_tx_ready==2), not a demo-key rebuild.  Runs real
      # client daemons (keys 0x02/0x03 != the scaffold fill) so the demo-key
      # path would produce Invalid Schnorr; asserts the co-signed path + a
      # confirmed distribution txid.  Catches the class that only surfaced on
      # signet (strong-key funding).
      - name: Multi-process distribution co-signed-path regression (under ASan+LSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:verify_asan_link_order=0
          LSAN_OPTIONS: exitcode=23:suppressions=${{ github.workspace }}/test/sanitizer_suppressions/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          bash tools/test_regtest_distribution.sh build
      # A payment must leave the factory leaf untouched: real daemons, one
      # client-initiated payment, then a unilateral exit (LSP first, clients
      # alone, and clients alone after refusing a leaf advance the LSP
      # proposes).  Both client commitments must confirm and pay each client
      # its balance.  Runs for the default leaf type and --arity 1.
      # The script starts and stops its own bitcoind (private datadir and RPC
      # port), independent of the node configured above.  That node runs with
      # minrelaytxfee/blockmintxfee lowered to 500 sat/kvB, because a
      # commitment transaction pays a fixed 154 sat for 167 vB, below the
      # default relay floor; without that the exit could not be exercised.
      # The script needs the sqlite3 CLI and python3 (installed above).
      - name: Payment then unilateral exit, leaf untouched (under ASan+LSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0:verify_asan_link_order=0
          LSAN_OPTIONS: exitcode=23:suppressions=${{ github.workspace }}/test/sanitizer_suppressions/lsan.supp:print_suppressions=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          bash tools/test_regtest_payment_no_leaf_advance.sh build
          ARITY=1 bash tools/test_regtest_payment_no_leaf_advance.sh build
      - name: Stop bitcoind
        if: always()
        run: bitcoin-cli -regtest stop 2>/dev/null || true

  regtest-tree-exit:
    runs-on: ubuntu-latest
    name: Regtest whole-tree exit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev sqlite3
      - name: Cache Bitcoin Core binary
        id: btc-cache
        uses: actions/cache@v4
        with:
          path: bitcoin-30.3
          key: bitcoin-core-30.3-x86_64
      - name: Download Bitcoin Core 30.3
        if: steps.btc-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://bitcoincore.org/bin/bitcoin-core-30.3/bitcoin-30.3-x86_64-linux-gnu.tar.gz
          echo "4753cd70416c629a2090503e8545a3c05e94a0f5037f8fb97b4c35c6e1afee0e  bitcoin-30.3-x86_64-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf bitcoin-30.3-x86_64-linux-gnu.tar.gz
      - name: Install Bitcoin Core
        run: sudo install -m 0755 bitcoin-30.3/bin/bitcoind bitcoin-30.3/bin/bitcoin-cli /usr/local/bin/
      # The harness checks confirmations of non-wallet txs (txindex) and
      # starts bitcoind itself from this conf; with MINRELAY it restarts the
      # node with a raised -minrelaytxfee.
      - name: Configure regtest
        run: |
          mkdir -p ~/.bitcoin
          cat > ~/.bitcoin/bitcoin.conf <<CONF
          regtest=1
          server=1
          txindex=1
          datadir=/home/runner/.bitcoin
          rpcuser=rpcuser
          rpcpassword=rpcpass
          fallbackfee=0.00001
          [regtest]
          rpcport=18443
          CONF
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --parallel
      # Bitcoin Core 30 default policy (0.1 sat/vB relay floor), the default
      # agreed tree rate of 0.1 sat/vB: the clients exit one at a time, every
      # pre-signed tx relays on its own, client 3 has no wallet coin, every
      # party is paid on chain and each client sweeps its to_local.
      - name: Tree exit at the default rate, one client at a time
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ARITY=2 N_CLIENTS=4 SOLO=1 NOWALLET=3 SWEEP=1 bash tools/test_regtest_tree_exit.sh build
      # Rate 0: no pre-signed tx pays a fee and every anchor is 0-value
      # (ephemeral dust): every tree tx goes in as a package with a child.  A
      # client with no wallet coin exiting first gets the "needs a fee-paying
      # child" result; once the tree is out it completes, its commitment's
      # 240-sat anchor paying for itself.
      - name: Tree exit at rate 0, packages only
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ARITY=2 N_CLIENTS=4 TREE_FEE_RATE=0 SOLO=1 EXIT_ORDER="1 2 3" EXPECT_NOCOIN=0 NOWALLET=0 PORT=29977 bash tools/test_regtest_tree_exit.sh build
      # A fee spike after signing: the node's floor rises to 0.5 sat/vB, above
      # the agreed rate; the client without a coin gets in with anchor-only
      # children, the others with wallet-funded ones.
      - name: Tree exit through a fee spike
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ARITY=2 N_CLIENTS=4 MINRELAY=500 NOWALLET=3 PORT=29978 bash tools/test_regtest_tree_exit.sh build
      # A third party attaches a cheap child to the anchor of every tree tx in
      # the mempool (anchor-only, then funded from its own wallet); the
      # clients' retries at a raised fee estimate must outbid those children.
      - name: Tree exit, anchor children attached by a third party
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ARITY=2 N_CLIENTS=4 GRIEF=1 CLIENT_FEE_EST=static:30 PORT=29979 bash tools/test_regtest_tree_exit.sh build
      - name: Tree exit, wallet-funded anchor children of a third party
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ARITY=2 N_CLIENTS=4 GRIEF=wallet CLIENT_FEE_EST=static:30 PORT=29981 bash tools/test_regtest_tree_exit.sh build
      # The node's floor at 5 sat/vB: the tree only gets in as CPFP packages
      # with wallet-funded children.
      - name: Tree exit, min relay fee far above the agreed rate
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ARITY=2 N_CLIENTS=4 MINRELAY=5000 PORT=29976 bash tools/test_regtest_tree_exit.sh build
      # A member whose ceiling is below the proposed rate refuses to sign.
      - name: Tree rate above a member's ceiling refused
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          ARITY=2 N_CLIENTS=4 TREE_FEE_RATE=2000 CLIENT_MAX_TREE_RATE=1000 EXPECT_REFUSE=1 PORT=29982 bash tools/test_regtest_tree_exit.sh build
      # The LSP's distribution TX at factory expiry: refused until final, in
      # as a package below the block minimum feerate, re-bumped when the fee
      # estimate rises, confirmed; the LSP is restarted from its DB twice
      # along the way (before the TX is final, and with it in the mempool).
      - name: Distribution TX at expiry, retried and re-bumped
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          bash tools/test_regtest_dist_expiry.sh build
      # A rotation that meets a fee spike is postponed with nothing changed
      # and without using its retries, then completes once the spike is over.
      - name: Rotation postponed through a fee spike
        env:
          REGTEST_CONF: /home/runner/.bitcoin/bitcoin.conf
        run: |
          ulimit -s unlimited 2>/dev/null || ulimit -s 65520 2>/dev/null || true
          bash tools/test_regtest_rotation_fee_postpone.sh build
      - name: Stop bitcoind
        if: always()
        run: bitcoin-cli -regtest stop 2>/dev/null || true

  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libssl-dev lcov
      - name: Build with coverage
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --parallel
      - name: Run tests
        run: ulimit -s unlimited && cd build && ./test_superscalar --unit
      - name: Generate coverage report
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info \
               --ignore-errors mismatch --ignore-errors unused
          lcov --remove coverage.info '*/build/_deps/*' '/usr/*' '*/tests/*' \
               --output-file filtered.info --ignore-errors unused
          genhtml filtered.info --output-directory coverage_report/ \
               --ignore-errors unused
      - name: Coverage summary
        run: |
          cd build
          lcov --summary filtered.info 2>&1 | tee coverage-summary.txt
          LINES=$(grep 'lines' coverage-summary.txt | grep -oP '[\d.]+%' | head -1)
          echo "### Coverage: $LINES" >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage_report/

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_wire_recv, fuzz_wire_parse_json, fuzz_tx_sighash,
                 fuzz_persist_load, fuzz_hex_decode,
                 fuzz_noise_handshake, fuzz_aead_decrypt]
    runs-on: ubuntu-latest
    name: Fuzz (${{ matrix.target }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libssl-dev clang
      - name: Build fuzz target
        run: |
          CC=clang cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_FUZZING=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build --parallel --target ${{ matrix.target }}
      # The corpus each run grows is kept for the next one (a new cache entry
      # per run, restored from the newest earlier entry of the same target).
      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: build/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # A crash, a leak, undefined behaviour or an input that runs longer
      # than -timeout seconds fails the job; the input that caused it is
      # uploaded below.
      - name: Run fuzz (5 min)
        run: |
          cd build
          mkdir -p corpus/${{ matrix.target }} artifacts
          SEEDS=""
          if [ -d ../fuzz/corpus/${{ matrix.target }} ]; then SEEDS=../fuzz/corpus/${{ matrix.target }}; fi
          ./${{ matrix.target }} corpus/${{ matrix.target }}/ $SEEDS \
            -max_total_time=300 -timeout=60 -artifact_prefix=artifacts/
      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducer-${{ matrix.target }}
          path: build/artifacts/
